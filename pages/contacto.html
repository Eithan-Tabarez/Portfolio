  <main>
    <div class="container">
    <h1>Contacto</h1>
    <section class="section">
      <h2>Contacto</h2>
      <form action="https://formspree.io/f/mvkopavk" method="POST">
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input
            type="text"
            class="form-control"
            id="nombre"
            name="nombre"
            placeholder="Tu nombre"
            required>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input
          type="email"
          class="form-control"
          id="email"
          name="email"
          placeholder="nombre@ejemplo.com"
          required>
        </div>
        <div class="mb-3">
          <label for="mensaje" class="form-label">Mensaje</label>
          <textarea
            class="form-control"
            id="mensaje"
            name="mensaje"
            rows="4"
            required>
          </textarea>
        </div>
        <button type="submit" class="button">
          Enviar
        </button>
      </form>
    </section>
    <section class="section">
      <article class="article">
        <h3>Informacion de Contacto</h3>
        <a class="button" href="https://github.com/Eithan-Tabarez" target="_blank" rel="noopener noreferrer">  Puedes comunicarte conmigo mediante GitHub.</a>
        <a class="button" href="mailto:EithanbTabarez14@gmail.com" target="_blank" rel="noopener noreferrer">Enviar correo electrónico</a>

      </article>
      <figure class="figure">
        <img src="../assets/Contacto.png" alt="Contacto" width="100" />
        <figcaption>Contacto.</figcaption>
      </figure>
    </section>
